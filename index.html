<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 로봇팔 수박 게임 (랭킹 시스템 추가)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <style>
        body { margin: 0; padding: 0; display: flex; align-items: center; justify-content: center; height: 100vh; background-color: #f0f2f5; font-family: 'Pretendard', -apple-system, sans-serif; overflow: hidden; }

        /* UI 레이어 (공통) */
        .ui-panel { pointer-events: none; z-index: 10; background: rgba(255, 255, 255, 0.9); padding: 15px 25px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }

        /* 왼쪽 상단 점수판 및 랭킹 */
        #ui-layer { position: absolute; top: 20px; left: 20px; text-align: left; pointer-events: auto; } /* 클릭 가능하게 변경 */
        #score-board { font-size: 1.2rem; font-weight: bold; color: #333; line-height: 1.5; margin-bottom: 15px; }
        .score-highlight { font-size: 1.8rem; color: #ff4757; }
        #control-hint { color: #888; font-size: 0.9rem; margin-top: 10px; }

        /* 랭킹 보드 스타일 */
        #leaderboard { min-width: 180px; padding: 15px; font-size: 0.95rem; }
        #leaderboard h3 { margin: 0 0 10px 0; font-size: 1.1rem; color: #2c3e50; text-align: center; border-bottom: 2px solid #ddd; padding-bottom: 5px; }
        #ranking-list { list-style: none; padding: 0; margin: 0; }
        #ranking-list li { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px dashed #eee; }
        #ranking-list li:last-child { border-bottom: none; }
        .rank-num { font-weight: bold; color: #f39c12; width: 20px; }
        .rank-name { flex-grow: 1; text-align: left; padding-left: 5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 80px; }
        .rank-score { font-weight: bold; color: #333; }

        /* 오른쪽 여백 진화 및 점수표 */
        #info-layer { position: absolute; top: 20px; right: 20px; text-align: left; }
        #evolution-chart { min-width: 200px; padding: 20px; }
        #evolution-chart h3 { margin: 0 0 15px 0; font-size: 1.2rem; color: #333; text-align: center; border-bottom: 2px solid #ddd; padding-bottom: 5px; }
        .evol-item { display: flex; align-items: center; margin-bottom: 12px; font-size: 0.95rem; }
        .evol-icons { display: flex; align-items: center; gap: 5px; min-width: 140px; }
        .evol-icons img { width: 25px; height: 25px; border-radius: 50%; object-fit: contain; }
        .evol-arrow { color: #888; }
        .evol-delete { color: #ff6b81; font-weight: bold; }
        .evol-score { color: #888; margin-left: auto; text-align: right; }
        .score-val { color: #ff4757; font-weight: bold; }

        /* 게임 화면 메인 */
        #game-container { position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.2); border-bottom-left-radius: 10px; border-bottom-right-radius: 10px; background: #fffdf9; }
        #claw { position: absolute; top: 0; width: 60px; height: 40px; background: #555; border-radius: 5px; transform: translateX(-50%); z-index: 5; transition: left 0.1s ease-out; display: flex; flex-direction: column; align-items: center; }
        #claw::before { content: "🤖"; font-size: 30px; position: absolute; bottom: -25px; }
        #next-fruit-preview { position: absolute; bottom: -80px; pointer-events: none; transition: opacity 0.2s; border-radius: 50%; object-fit: contain; }
        #death-line { position: absolute; top: 120px; width: 100%; height: 2px; border-top: 3px dashed #ff4757; pointer-events: none; opacity: 0.6; }

        /* 게임 오버 화면 */
        #game-over-screen { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); z-index: 20; flex-direction: column; align-items: center; justify-content: center; border-radius: 10px; color: white; text-align: center; }
        #game-over-screen h2 { font-size: 3rem; margin: 0 0 10px 0; color: #ff6b81; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
        
        /* 랭킹 등록 UI */
        #record-input-section { display: none; flex-direction: column; align-items: center; background: rgba(255,255,255,0.1); padding: 20px; border-radius: 10px; margin-bottom: 20px; border: 2px solid #f1c40f; }
        #record-input-section p { color: #f1c40f; font-weight: bold; margin: 0 0 15px 0; }
        #player-name { padding: 10px; font-size: 1.2rem; border-radius: 5px; border: none; outline: none; text-align: center; width: 150px; margin-bottom: 10px; font-family: 'Pretendard', sans-serif; }
        #submit-score-btn { padding: 10px 20px; font-size: 1.2rem; font-weight: bold; color: white; background: #3498db; border: none; border-radius: 5px; cursor: pointer; }
        #submit-score-btn:hover { background: #2980b9; }

        #restart-btn { padding: 15px 30px; font-size: 1.5rem; font-weight: bold; color: white; background: #2ed573; border: none; border-radius: 10px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: transform 0.1s, background 0.2s; }
        #restart-btn:hover { background: #27ae60; transform: scale(1.05); }
    </style>
</head>
<body>

    <div id="ui-layer">
        <div id="score-board" class="ui-panel">
            현재 점수: <span id="score" class="score-highlight">0</span>
            <div id="control-hint">클릭해서 과일을 떨어트려요!</div>
        </div>
        
        <div id="leaderboard" class="ui-panel">
            <h3>🏆 명예의 전당 (Top 10)</h3>
            <ul id="ranking-list">
                </ul>
        </div>
    </div>

    <div id="info-layer">
        <div id="evolution-chart" class="ui-panel">
            <h3>과일 진화 및 점수표</h3>
        </div>
    </div>

    <div id="game-container">
        <div id="claw">
            <img id="next-fruit-preview" src="" alt="preview">
        </div>
        <div id="death-line"></div>
        
        <div id="game-over-screen">
            <h2>GAME OVER</h2>
            <p style="font-size: 1.5rem; margin-bottom: 20px;">이번 점수: <span id="final-score" style="font-weight: bold; color: #fff;">0</span></p>
            
            <div id="record-input-section">
                <p>🎉 TOP 10 랭킹 진입! 이름을 남기세요 🎉</p>
                <input type="text" id="player-name" placeholder="닉네임 (최대6자)" maxlength="6">
                <button id="submit-score-btn">랭킹 등록하기</button>
            </div>

            <button id="restart-btn">다시 하기</button>
        </div>
    </div>

    <script>
        // --- 랭킹 시스템 (Local Storage) 로직 ---
        let rankings = JSON.parse(localStorage.getItem('suikaRankings')) || [];

        function updateRankingUI() {
            const listEl = document.getElementById('ranking-list');
            listEl.innerHTML = '';
            
            if (rankings.length === 0) {
                listEl.innerHTML = '<li style="text-align:center; color:#999; justify-content:center;">아직 기록이 없습니다.</li>';
                return;
            }

            rankings.forEach((entry, index) => {
                const li = document.createElement('li');
                li.innerHTML = `
                    <span class="rank-num">${index + 1}</span>
                    <span class="rank-name">${entry.name}</span>
                    <span class="rank-score">${entry.score}점</span>
                `;
                listEl.appendChild(li);
            });
        }
        updateRankingUI(); // 시작할 때 랭킹 그려주기

        // 랭킹 등록 가능한지 확인하는 함수
        function isTop10(newScore) {
            if (newScore === 0) return false;
            if (rankings.length < 10) return true; // 10명이 안 찼으면 무조건 등록
            return newScore > rankings[rankings.length - 1].score; // 10등 점수보다 높으면 등록
        }

        // --- 기존 게임 데이터 ---
        const FRUITS = [
            { name: "딸기", radius: 12, score: 10, imgUrl: "1.png", zoom: 2.2 },
            { name: "키위", radius: 18, score: 30, imgUrl: "2.png", zoom: 2.1 },
            { name: "귤", radius: 25, score: 60, imgUrl: "3.png", zoom: 2.0 },
            { name: "복숭아", radius: 35, score: 100, imgUrl: "4.png", zoom: 1.9 },
            { name: "포도", radius: 48, score: 150, imgUrl: "5.png" , zoom: 1.8 },
            { name: "멜론", radius: 65, score: 300, imgUrl: "6.png" , zoom: 1.7 },
            { name: "수박", radius: 90, score: 600, imgUrl: "7.png" , zoom: 1.6 }
        ];

        const loadedImages = {};
        const imageRatios = {}; 

        FRUITS.forEach(fruit => {
            const img = new Image();
            img.src = fruit.imgUrl;
            img.onload = () => {
                loadedImages[fruit.name] = img;
                imageRatios[fruit.name] = img.width / img.height; 
                checkAllImagesLoaded(); 
            };
        });

        function generateEvolutionChart() {
            const chartEl = document.getElementById('evolution-chart');
            for (let i = 0; i < FRUITS.length; i++) {
                const item = FRUITS[i];
                const evolItemDiv = document.createElement('div');
                evolItemDiv.className = 'evol-item';

                const iconsDiv = document.createElement('div');
                iconsDiv.className = 'evol-icons';
                
                const imgA = document.createElement('img'); imgA.src = item.imgUrl; imgA.alt = item.name;
                const plusSpan = document.createElement('span'); plusSpan.innerText = '+';
                const imgB = document.createElement('img'); imgB.src = item.imgUrl; imgB.alt = item.name;
                const arrowSpan = document.createElement('span'); arrowSpan.innerText = '→';
                
                iconsDiv.appendChild(imgA); iconsDiv.appendChild(plusSpan); iconsDiv.appendChild(imgB); iconsDiv.appendChild(arrowSpan);

                let finalScoreVal = item.score;
                if (i === FRUITS.length - 1) { 
                    const deleteSpan = document.createElement('span'); deleteSpan.className = 'evol-delete'; deleteSpan.innerText = '삭제💥';
                    iconsDiv.appendChild(deleteSpan);
                    finalScoreVal = item.score * 2; 
                } else {
                    const nextImg = document.createElement('img'); nextImg.src = FRUITS[i + 1].imgUrl; nextImg.alt = FRUITS[i + 1].name;
                    iconsDiv.appendChild(nextImg);
                }

                const scoreDiv = document.createElement('div');
                scoreDiv.className = 'evol-score';
                scoreDiv.innerHTML = `점수: <span class="score-val">${finalScoreVal}</span>`;

                evolItemDiv.appendChild(iconsDiv);
                evolItemDiv.appendChild(scoreDiv);
                chartEl.appendChild(evolItemDiv);
            }
        }

        let loadedCount = 0;
        function checkAllImagesLoaded() {
            loadedCount++;
            if (loadedCount === FRUITS.length) {
                generateEvolutionChart();
            }
        }

        // --- 게임 물리 엔진 ---
        let score = 0;
        let isClickable = true;
        let isGameOver = false;
        let currentFruitIndex = 0;

        const claw = document.getElementById('claw');
        const nextFruitPreview = document.getElementById('next-fruit-preview');
        const scoreEl = document.getElementById('score');
        const gameOverScreen = document.getElementById('game-over-screen');
        const container = document.getElementById('game-container');
        const recordSection = document.getElementById('record-input-section');
        const restartBtn = document.getElementById('restart-btn');

        const { Engine, Render, Runner, Bodies, Composite, Events } = Matter;
        const engine = Engine.create();
        const world = engine.world;

        const width = 450;
        const height = 700;

        const render = Render.create({
            element: container,
            engine: engine,
            options: { width: width, height: height, wireframes: false, background: 'transparent' }
        });

        const wallOptions = { isStatic: true, render: { visible: false } };
        const ground = Bodies.rectangle(width / 2, height + 10, width, 40, wallOptions);
        const leftWall = Bodies.rectangle(-10, height / 2, 40, height, wallOptions);
        const rightWall = Bodies.rectangle(width + 10, height / 2, 40, height, wallOptions);

        Composite.add(world, [ground, leftWall, rightWall]);

        Render.run(render);
        const runner = Runner.create();
        Runner.run(runner, engine);

        function setNextFruit() {
            currentFruitIndex = Math.floor(Math.random() * 3);
            const config = FRUITS[currentFruitIndex];
            
            nextFruitPreview.src = config.imgUrl;
            nextFruitPreview.style.width = (config.radius * 2) + "px";
            nextFruitPreview.style.height = (config.radius * 2) + "px";
            nextFruitPreview.style.opacity = '1';
        }
        setNextFruit();

        let mouseX = width / 2;

        container.addEventListener('mousemove', (e) => {
            if (isGameOver) return;
            const rect = container.getBoundingClientRect();
            mouseX = e.clientX - rect.left;
            
            const currentRadius = FRUITS[currentFruitIndex].radius;
            if (mouseX < currentRadius) mouseX = currentRadius;
            if (mouseX > width - currentRadius) mouseX = width - currentRadius;
            
            claw.style.left = mouseX + 'px';
        });

        container.addEventListener('click', () => {
            if (!isClickable || isGameOver) return;
            dropFruit(mouseX, 100, currentFruitIndex);
            isClickable = false;
            nextFruitPreview.style.opacity = '0';

            setTimeout(() => {
                if (!isGameOver) {
                    setNextFruit();
                    isClickable = true;
                }
            }, 1000);
        });

        function dropFruit(x, y, index) {
            const config = FRUITS[index];
            const fruit = Bodies.circle(x, y, config.radius, {
                index: index, restitution: 0.2, friction: 0.1, render: { visible: false } 
            });
            Composite.add(world, fruit);
        }

        Events.on(engine, 'collisionStart', (event) => {
            event.pairs.forEach((pair) => {
                const bodyA = pair.bodyA;
                const bodyB = pair.bodyB;

                if (bodyA.index !== undefined && bodyA.index === bodyB.index) {
                    const currentIndex = bodyA.index;
                    if (!Composite.allBodies(world).includes(bodyA) || !Composite.allBodies(world).includes(bodyB)) return;

                    if (currentIndex === FRUITS.length - 1) { 
                        Composite.remove(world, [bodyA, bodyB]);
                        updateScore(FRUITS[currentIndex].score * 2);
                        return;
                    }

                    const newX = (bodyA.position.x + bodyB.position.x) / 2;
                    const newY = (bodyA.position.y + bodyB.position.y) / 2;

                    Composite.remove(world, [bodyA, bodyB]);
                    
                    const nextIndex = currentIndex + 1;
                    const nextConfig = FRUITS[nextIndex];
                    const newFruit = Bodies.circle(newX, newY, nextConfig.radius, {
                        index: nextIndex, restitution: 0.2, render: { visible: false } 
                    });

                    Composite.add(world, newFruit);
                    updateScore(nextConfig.score);
                }
            });
        });

        function updateScore(points) {
            score += points;
            scoreEl.innerText = score;
        }

        Events.on(engine, 'afterUpdate', () => {
            if (isGameOver) return;
            world.bodies.forEach(body => {
                if (body.isStatic) return;
                if (body.position.y < 120 && body.velocity.y < 0.1 && body.velocity.x < 0.1 && isClickable) {
                    triggerGameOver();
                }
            });
        });

        // 게임 오버 발생 시
        function triggerGameOver() {
            isGameOver = true;
            isClickable = false;
            document.getElementById('final-score').innerText = score;
            
            // 랭킹 10위 안에 들었는지 검사
            if (isTop10(score)) {
                recordSection.style.display = 'flex'; // 이름 입력창 표시
                restartBtn.style.display = 'none'; // 등록하기 전까지 다시하기 숨김
            } else {
                recordSection.style.display = 'none';
                restartBtn.style.display = 'block';
            }

            gameOverScreen.style.display = 'flex';
        }

        // 랭킹 등록 버튼 클릭 시 로직
        document.getElementById('submit-score-btn').addEventListener('click', () => {
            const nameInput = document.getElementById('player-name').value.trim() || '익명';
            
            // 배열에 추가하고 정렬(내림차순)
            rankings.push({ name: nameInput, score: score });
            rankings.sort((a, b) => b.score - a.score);
            
            // 딱 10명까지만 유지 (10명 초과분은 잘라냄)
            rankings = rankings.slice(0, 10);
            
            // 로컬 스토리지에 저장 및 UI 갱신
            localStorage.setItem('suikaRankings', JSON.stringify(rankings));
            updateRankingUI();

            // 등록 후 다시하기 버튼 띄우기
            recordSection.style.display = 'none';
            restartBtn.style.display = 'block';
        });

        restartBtn.addEventListener('click', () => {
            gameOverScreen.style.display = 'none';
            score = 0; scoreEl.innerText = score;
            
            const fruitsToRemove = Composite.allBodies(world).filter(body => !body.isStatic);
            Composite.remove(world, fruitsToRemove);

            isGameOver = false; isClickable = true; setNextFruit();
        });

        Events.on(render, 'afterRender', () => {
            const context = render.context;
            
            Composite.allBodies(world).forEach(body => {
                if (body.index !== undefined) {
                    const config = FRUITS[body.index];
                    const img = loadedImages[config.name];
                    const originalRatio = imageRatios[config.name]; 
                    
                    if (img && originalRatio) {
                        context.save();
                        context.translate(body.position.x, body.position.y);
                        context.rotate(body.angle);
                        
                        const scaleZoom = config.zoom || 1.0;
                        const diameter = config.radius * 2;
                        let drawWidth, drawHeight;
                        
                        if (originalRatio > 1) {
                            drawWidth = diameter * scaleZoom;
                            drawHeight = (diameter / originalRatio) * scaleZoom; 
                        } else {
                            drawHeight = diameter * scaleZoom;
                            drawWidth = (diameter * originalRatio) * scaleZoom; 
                        }
                        
                        context.drawImage(img, -drawWidth / 2, -drawHeight / 2, drawWidth, drawHeight);
                        context.restore();
                    }
                }
            });
        });
    </script>
</body>
</html>
