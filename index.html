<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 로봇팔 수박 게임</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 12px;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100dvh;
            background-color: #f0f2f5;
            font-family: 'Pretendard', sans-serif;
            overflow-x: hidden;
            overflow-y: auto;
        }
        #app-layout {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 20px;
            width: 100%;
            max-width: 1020px;
            margin: auto;
        }
        .ui-panel {
            background: rgba(255, 255, 255, 0.9);
            padding: 15px 20px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            box-sizing: border-box;
        }
        #ui-layer {
            width: 240px;
            flex-shrink: 0;
            text-align: left;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        #score-board {
            font-size: 1.15rem;
            font-weight: bold;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .hud-main-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }
        .score-box { display: flex; flex-direction: column; gap: 2px; }
        .score-label { font-size: 0.9rem; color: #57606f; }
        .score-highlight { font-size: 1.7rem; color: #ff4757; line-height: 1.1; }
        .next-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            background: #fffdf9;
            border: 1px solid #e9ecef;
            border-radius: 10px;
            padding: 4px 10px;
            flex-shrink: 0;
        }
        .next-label { font-size: 0.7rem; color: #747d8c; font-weight: bold; letter-spacing: 0.04em; }
        #next-queue-img { width: 28px; height: 28px; object-fit: contain; display: block; }
        .hud-skill-row {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .skill-btn, #sound-toggle-btn {
            background: #f1f2f6;
            color: #2f3542;
            border: 1px solid #dfe4ea;
            border-radius: 8px;
            padding: 6px 8px;
            font-size: 0.82rem;
            font-weight: bold;
            transition: background 0.15s, transform 0.1s, opacity 0.15s;
            white-space: nowrap;
        }
        .skill-btn { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 3px; }
        #sound-toggle-btn { flex-shrink: 0; min-width: 34px; }
        .skill-btn:hover:not(:disabled), #sound-toggle-btn:hover { background: #e6e8ef; transform: translateY(-1px); }
        .skill-btn:active:not(:disabled), #sound-toggle-btn:active { transform: translateY(0); }
        .skill-btn:disabled { opacity: 0.45; cursor: not-allowed; }
        #leaderboard h3, #evolution-chart h3 {
            margin: 0 0 10px 0;
            text-align: center;
            border-bottom: 2px solid #ddd;
            padding-bottom: 5px;
        }
        #ranking-list { list-style: none; padding: 0; margin: 0; }
        #ranking-list li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 6px;
            padding: 5px 0;
            border-bottom: 1px dashed #eee;
        }
        .rank-num { font-weight: bold; color: #f39c12; width: 25px; flex-shrink: 0; }
        .rank-name { flex-grow: 1; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .rank-score { font-weight: bold; flex-shrink: 0; }

        #info-layer { width: 240px; flex-shrink: 0; }
        .evol-item { display: flex; align-items: center; margin-bottom: 8px; font-size: 0.9rem; }
        .evol-icons { display: flex; align-items: center; gap: 4px; }
        .evol-icons img { width: 26px; height: 26px; object-fit: contain; vertical-align: middle; }

        #game-stage { position: relative; flex-shrink: 0; }
        #game-container {
            position: relative;
            width: 450px;
            height: 700px;
            transform-origin: top left;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            background: #fffdf9;
            border-radius: 10px;
            overflow: hidden;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }
        #claw {
            position: absolute;
            top: 0;
            left: 225px;
            width: 60px;
            height: 40px;
            background: #555;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 5;
            transition: left 0.08s ease-out;
            pointer-events: none;
        }
        #claw::before { content: "🤖"; font-size: 30px; position: absolute; bottom: -25px; }
        #next-fruit-preview { position: absolute; pointer-events: none; transition: opacity 0.2s; }
        #death-line {
            position: absolute;
            top: 120px;
            left: 0;
            width: 100%;
            height: 2px;
            border-top: 3px dashed #ff4757;
            pointer-events: none;
            opacity: 0.6;
            transition: opacity 0.15s;
        }
        #death-line.danger-active {
            border-top-color: #ff1e38;
            opacity: 1;
            filter: drop-shadow(0 0 6px #ff4757);
            animation: dangerPulse 0.45s ease-in-out infinite alternate;
        }
        #danger-banner {
            display: none;
            position: absolute;
            top: 82px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 71, 87, 0.92);
            color: white;
            padding: 4px 14px;
            border-radius: 999px;
            font-size: 0.92rem;
            font-weight: bold;
            z-index: 12;
            pointer-events: none;
            box-shadow: 0 2px 10px rgba(255,71,87,0.4);
            white-space: nowrap;
        }
        @keyframes dangerPulse {
            from { opacity: 0.55; }
            to { opacity: 1; }
        }

        #game-over-screen {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 20;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            padding: 20px;
            box-sizing: border-box;
            pointer-events: auto;
        }
        #record-input-section {
            display: none;
            flex-direction: column;
            align-items: center;
            background: rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 10px;
            border: 2px solid #f1c40f;
            margin-bottom: 15px;
            box-sizing: border-box;
            max-width: 90%;
            pointer-events: auto;
        }
        #player-name {
            padding: 10px;
            font-size: 1.1rem;
            border-radius: 5px;
            margin-bottom: 10px;
            text-align: center;
            max-width: 100%;
            box-sizing: border-box;
        }
        button { cursor: pointer; border: none; font-weight: bold; border-radius: 10px; }
        #submit-score-btn { padding: 10px 20px; background: #3498db; color: white; }
        #restart-btn { padding: 15px 30px; font-size: 1.5rem; background: #2ed573; color: white; transition: transform 0.1s; }
        #restart-btn:hover { transform: scale(1.05); }

        #portal-ssudam-btn {
            position: fixed;
            top: 10px;
            left: 10px;
            z-index: 30;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 13px;
            border-radius: 999px;
            background: linear-gradient(135deg, #0b2a5b, #1e88e5);
            color: #ffffff;
            text-decoration: none;
            font-size: 0.82rem;
            font-weight: bold;
            border: 2px solid rgba(255, 255, 255, 0.7);
            box-shadow: 0 4px 12px rgba(11, 42, 91, 0.25);
            transition: transform 0.14s ease, filter 0.14s ease;
            white-space: nowrap;
        }
        #portal-ssudam-btn:hover {
            transform: translateY(-1px);
            filter: brightness(1.06);
        }
        #portal-ssudam-btn:active {
            transform: scale(0.96);
        }

        @media (max-width: 1039px) {
            body { align-items: flex-start; padding: 48px 10px 10px; }
            #app-layout { flex-direction: column; align-items: center; gap: 10px; width: 100%; margin: 0 auto; }
            #ui-layer { display: contents; }
            #score-board {
                order: 1;
                width: 100%;
                max-width: var(--stage-w, 450px);
                flex-direction: row;
                align-items: center;
                justify-content: space-between;
                gap: 8px;
                padding: 8px 14px;
            }
            .hud-main-row { gap: 10px; }
            .score-box { flex-direction: row; align-items: baseline; gap: 6px; }
            .next-box { flex-direction: row; gap: 6px; padding: 3px 8px; }
            #next-queue-img { width: 24px; height: 24px; }
            .hud-skill-row { gap: 5px; }
            .skill-btn { flex: initial; }
            #game-stage { order: 2; }
            #leaderboard { order: 3; width: 100%; max-width: var(--stage-w, 450px); }
            #info-layer { order: 4; width: 100%; max-width: var(--stage-w, 450px); }
        }

        @media (max-width: 600px) {
            body { padding: 44px 6px 16px; }
            #portal-ssudam-btn { top: 6px; left: 6px; padding: 5px 10px; font-size: 0.76rem; }
            #app-layout { gap: 6px; }
            #score-board {
                padding: 5px 10px;
                border-radius: 10px;
                font-size: 0.9rem;
                max-width: 100%;
                gap: 6px;
            }
            .score-label { font-size: 0.78rem; }
            .score-highlight { font-size: 1.3rem; }
            .next-box { padding: 2px 6px; gap: 4px; }
            .next-label { font-size: 0.65rem; }
            #next-queue-img { width: 22px; height: 22px; }
            .skill-text { display: none; }
            .skill-btn, #sound-toggle-btn { padding: 5px 8px; font-size: 0.82rem; }
            #sound-toggle-btn { min-width: 30px; }
            #game-container { border-radius: 6px; }
            #leaderboard, #info-layer { max-width: 100%; }
            #leaderboard, #evolution-chart { padding: 12px 14px; }
        }
        @media (max-width: 420px) {
            .score-label { display: none; }
        }
    </style>

<body>
    <a id="portal-ssudam-btn" href="https://leeseungsang.github.io/ssudam-game/" title="쓰담쓰담: 수원역 대청소로 이동">🎮 게임전환 · 🤖 쓰담쓰담</a>

    <div id="app-layout">

    <script>
        // --- 1. Firebase 설정 ---
        const firebaseConfig = {
            apiKey: "AIzaSyBWo6A1fNgaj7FOWYviDcUaS7gLDttFTMw",
            authDomain: "dlro-s-game.firebaseapp.com",
            projectId: "dlro-s-game",
            storageBucket: "dlro-s-game.firebasestorage.app",
            messagingSenderId: "383142943189",
            appId: "1:383142943189:web:af99262690742e9475c55c"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // --- 2. 랭킹 시스템 ---
        async function fetchRankings() {
            try {
                const snapshot = await db.collection("rankings").orderBy("score", "desc").limit(10).get();
                const listEl = document.getElementById('ranking-list');
                listEl.textContent = '';
                if (snapshot.empty) {
                    const emptyLi = document.createElement('li');
                    emptyLi.textContent = '아직 등록된 기록이 없습니다.';
                    listEl.appendChild(emptyLi);
                    return;
                }
                snapshot.docs.forEach((doc, index) => {
                    const data = doc.data();
                    const li = document.createElement('li');

                    const numSpan = document.createElement('span');
                    numSpan.className = 'rank-num';
                    numSpan.textContent = String(index + 1);

                    const nameSpan = document.createElement('span');
                    nameSpan.className = 'rank-name';
                    nameSpan.textContent = typeof data.name === 'string' ? data.name : '익명';

                    const scoreSpan = document.createElement('span');
                    scoreSpan.className = 'rank-score';
                    scoreSpan.textContent = String(typeof data.score === 'number' ? data.score : 0);

                    li.append(numSpan, nameSpan, scoreSpan);
                    listEl.appendChild(li);
                });
            } catch (e) {
                console.error("랭킹 로드 실패:", e);
            }
        }
        fetchRankings();

        // --- 3. 게임 데이터 및 물리 엔진 (과일 실루엣 맞춤 콜라이더 + 콤보/사운드/스킬) ---
        const FRUITS = [

                ]
            },
            {

                vertices: [
                    {x:-0.881,y:-0.461},{x:-0.775,y:-0.681},{x:-0.433,y:-0.909},{x:-0.001,y:-1.031},
                    {x:0.22,y:-0.999},{x:0.709,y:-0.754},{x:0.904,y:-0.371},{x:0.937,y:0.118},
                    {x:0.725,y:0.721},{x:0.464,y:0.933},{x:0.13,y:1.023},{x:-0.408,y:0.958},
                    {x:-0.799,y:0.599},{x:-0.938,y:0.143}
                ]
            },
            {
                name: "귤", radius: 45, score: 60, imgUrl: "3.png", color: "#ffa502",
                imgWScale: 2.1575, imgHScale: 2.2967, offsetX: -0.0118, offsetY: -0.1848,
                vertices: [
                    {x:-1.036,y:-0.049},{x:-0.968,y:-0.346},{x:-0.678,y:-0.742},{x:-0.358,y:-0.909},
                    {x:0.335,y:-0.917},{x:0.624,y:-0.78},{x:0.929,y:-0.43},{x:1.036,y:-0.034},

                ]
            },
            {

                    {x:0.974,y:-0.588},{x:1.062,y:-0.271},{x:0.919,y:0.388},{x:0.792,y:0.571},
                    {x:0.26,y:0.952},{x:-0.066,y:1.031},{x:-0.264,y:0.952},{x:-0.764,y:0.602},
                    {x:-0.899,y:0.412},{x:-1.05,y:-0.152}
                ]
            },
            {

            },
            {

                imgWScale: 2.1458, imgHScale: 2.4227, offsetX: 0.0269, offsetY: -0.1961
            }
        ];

        const loadedImages = {};

        FRUITS.forEach(fruit => {
            const img = new Image();
            img.onload = () => {
                loadedImages[fruit.name] = img;
            };
            img.src = fruit.imgUrl;
        });

        function generateEvolutionChart() {
            const chartEl = document.getElementById('evolution-chart');
            chartEl.innerHTML = '<h3>진화표</h3>';
            FRUITS.forEach((item, i) => {
                const div = document.createElement('div');
                div.className = 'evol-item';
                div.innerHTML = `<div class="evol-icons"><img src="${item.imgUrl}" alt="${item.name}"> + <img src="${item.imgUrl}" alt="${item.name}"> → ${i === FRUITS.length - 1 ? '💥' : `<img src="${FRUITS[i+1].imgUrl}" alt="${FRUITS[i+1].name}">`}</div> <div style="margin-left:auto; color:#ff4757; font-weight:bold;">${i === FRUITS.length - 1 ? 1200 : FRUITS[i+1].score}</div>`;
                chartEl.appendChild(div);
            });
        }
        generateEvolutionChart();

        // --- 🔊 Web Audio API 내장 효과음 엔진 ---
        let audioCtx = null;
        let isMuted = false;

        function ensureAudio() {
            if (isMuted) return null;
            try {
                if (!audioCtx) {
                    const Ctx = window.AudioContext || window.webkitAudioContext;
                    if (!Ctx) return null;
                    audioCtx = new Ctx();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                return audioCtx;
            } catch (e) {
                return null;
            }
        }

        function playTone(freqStart, freqEnd, duration, type = 'sine', gainVal = 0.12, delay = 0) {
            if (isMuted) return;
            const ctx = ensureAudio();
            if (!ctx) return;
            try {
                const startTime = ctx.currentTime + delay;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freqStart, startTime);
                if (freqEnd !== freqStart) {
                    osc.frequency.exponentialRampToValueAtTime(Math.max(20, freqEnd), startTime + duration);
                }
                gain.gain.setValueAtTime(0.0001, startTime);
                gain.gain.linearRampToValueAtTime(gainVal, startTime + 0.01);
                gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(startTime);
                osc.stop(startTime + duration + 0.02);
            } catch (e) {}
        }

        function playDropSound() {
            playTone(260, 140, 0.065, 'sine', 0.12);
        }

        function playMergeSound(idx, combo) {
            const scale = [330, 392, 440, 523.25, 587.33, 659.25, 783.99];
            const mult = Math.min(1.5, 1 + Math.max(0, combo - 1) * 0.08);
            const base = scale[Math.min(idx, scale.length - 1)] * mult;
            playTone(base, base * 1.12, 0.13, 'triangle', 0.14, 0);
            playTone(base * 1.25, base * 1.35, 0.15, 'sine', 0.11, 0.045);
        }

        function playWatermelonSound() {
            const fanfare = [523.25, 659.25, 783.99, 1046.5];
            fanfare.forEach((freq, i) => {
                playTone(freq, freq, 0.18, 'triangle', 0.14, i * 0.065);
            });
        }

        function playSkillSound(type) {
            if (type === 'shake') {
                playTone(140, 220, 0.11, 'sawtooth', 0.08, 0);
                playTone(220, 110, 0.16, 'triangle', 0.1, 0.08);
            } else {
                playTone(440, 660, 0.1, 'sine', 0.11, 0);
            }
        }

        function playDangerBeep() {
            playTone(880, 880, 0.07, 'sine', 0.08);
        }

        document.getElementById('sound-toggle-btn').addEventListener('click', () => {
            isMuted = !isMuted;
            document.getElementById('sound-toggle-btn').textContent = isMuted ? '🔇' : '🔊';
            if (!isMuted) ensureAudio();
        });

        // --- 게임 상태 및 물리 엔진 ---
        const MAX_SHAKE_COUNT = 2;
        const SHAKE_DROP_CHANCE = 0.01;
        const DROP_FRUIT_WEIGHTS = [0.55, 0.30, 0.15]; // 딸기 55%, 키위 30%, 귤 15%

        function pickRandomDropFruit(excludeIndex = -1) {
            let total = 0;
            for (let i = 0; i < DROP_FRUIT_WEIGHTS.length; i++) {
                if (i !== excludeIndex) total += DROP_FRUIT_WEIGHTS[i];
            }
            let r = Math.random() * total;
            for (let i = 0; i < DROP_FRUIT_WEIGHTS.length; i++) {
                if (i === excludeIndex) continue;
                r -= DROP_FRUIT_WEIGHTS[i];
                if (r < 0) return i;
            }
            return excludeIndex === 0 ? 1 : 0;
        }

        let score = 0;
        let isClickable = true;
        let isGameOver = false;
        let currentFruitIndex = pickRandomDropFruit();
        let nextFruitIndex = pickRandomDropFruit();
        let shakeCount = 0;
        let swapCount = 3;
        let shakeGraceUntil = 0;

        const particles = [];
        const floatingTexts = [];
        let comboCount = 0;
        let lastMergeTime = 0;
        let shakeIntensity = 0;
        let dangerElapsed = 0;
        let lastUpdateTick = Date.now();
        let lastBeepTime = 0;

        const { Engine, Render, Runner, Bodies, Composite, Events, Body } = Matter;
        const engine = Engine.create(); const world = engine.world;
        const width = 450; const height = 700;
        const DROP_Y = 100;
        const container = document.getElementById('game-container');

        const render = Render.create({ element: container, engine: engine, options: { width: width, height: height, wireframes: false, background: 'transparent' } });

        const wallThickness = 40;
        const wallOptions = { isStatic: true, render: { visible: false } };
        const ground = Bodies.rectangle(width / 2, height + wallThickness / 2, width + wallThickness * 2, wallThickness, wallOptions);
        const leftWall = Bodies.rectangle(-wallThickness / 2, height / 2, wallThickness, height + wallThickness * 2, wallOptions);
        const rightWall = Bodies.rectangle(width + wallThickness / 2, height / 2, wallThickness, height + wallThickness * 2, wallOptions);
        Composite.add(world, [ground, leftWall, rightWall]);

        Render.run(render); Runner.run(Runner.create(), engine);

        function updateGameScale() {
            const vw = window.visualViewport ? window.visualViewport.width : window.innerWidth;
            const vh = window.visualViewport ? window.visualViewport.height : window.innerHeight;
            const isCompact = vw < 1040;
            const isMobile = vw <= 600;
            const horizPadding = isMobile ? 12 : (isCompact ? 20 : 552);
            const availW = Math.max(260, vw - horizPadding);
            let availH;
            if (isCompact) {
                const scoreEl = document.getElementById('score-board');
                const scoreH = scoreEl ? scoreEl.offsetHeight : (isMobile ? 38 : 52);
                const vertMargin = isMobile ? 56 : 70;
                availH = Math.max(360, vh - scoreH - vertMargin);
            } else {
                availH = Math.max(420, vh - 32);
            }
            const scale = Math.min(1, availW / width, availH / height);
            const stage = document.getElementById('game-stage');
            const scaledW = Math.round(width * scale);
            const scaledH = Math.round(height * scale);
            stage.style.width = scaledW + 'px';
            stage.style.height = scaledH + 'px';
            container.style.transform = `scale(${scale})`;
            document.documentElement.style.setProperty('--stage-w', scaledW + 'px');
        }
        updateGameScale();
        window.addEventListener('resize', updateGameScale);
        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', updateGameScale);
        }

        function updateSkillButtons() {
            const shakeBtn = document.getElementById('shake-btn');
            const swapBtn = document.getElementById('swap-btn');
            document.getElementById('shake-count').textContent = `${shakeCount}/${MAX_SHAKE_COUNT}`;
            document.getElementById('swap-count').textContent = `(${swapCount})`;
            shakeBtn.disabled = shakeCount <= 0 || isGameOver;
            swapBtn.disabled = swapCount <= 0 || !isClickable || isGameOver;
        }

        function setNextFruit(advance = true) {
            if (advance) {
                currentFruitIndex = nextFruitIndex;
                nextFruitIndex = pickRandomDropFruit();
            }
            const config = FRUITS[currentFruitIndex];
            const preview = document.getElementById('next-fruit-preview');
            const drawW = config.imgWScale * config.radius;
            const drawH = config.imgHScale * config.radius;
            const drawOffX = config.offsetX * config.radius;
            const drawOffY = config.offsetY * config.radius;
            preview.src = config.imgUrl;
            preview.style.width = drawW + 'px';
            preview.style.height = drawH + 'px';
            preview.style.left = (30 - drawW / 2 + drawOffX) + 'px';
            preview.style.top = (DROP_Y - drawH / 2 + drawOffY) + 'px';
            preview.style.opacity = '1';

            const queueImg = document.getElementById('next-queue-img');
            if (queueImg) {
                queueImg.src = FRUITS[nextFruitIndex].imgUrl;
            }

            const clawEl = document.getElementById('claw');
            const margin = config.radius * 1.08;
            const curX = parseFloat(clawEl.style.left);
            if (!Number.isNaN(curX)) {
                clawEl.style.left = Math.min(width - margin, Math.max(margin, curX)) + 'px';
            }
        }
        setNextFruit(false);
        updateSkillButtons();

        function spawnFloatingText(x, y, text, color = '#2f3542', scale = 1) {
            floatingTexts.push({
                x: x,
                y: y,
                text: text,
                color: color,
                scale: scale,
                alpha: 1,
                vy: -1.4
            });
        }

        function spawnMergeEffects(x, y, idx, earnedScore, combo) {
            const baseColor = FRUITS[idx].color || '#ff4757';
            for (let i = 0; i < 16; i++) {
                const angle = (Math.PI * 2 * i) / 16 + (Math.random() - 0.5) * 0.35;
                const speed = 2 + Math.random() * 4.5;
                const isSparkle = combo >= 2 && i % 3 === 0;
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed - 0.8,
                    r: 3 + Math.random() * 4.5,
                    alpha: 1,
                    color: isSparkle ? '#f1c40f' : baseColor
                });
            }
            spawnFloatingText(x, y, `+${earnedScore}`, baseColor, 1);
            if (combo >= 2) {
                const comboScale = Math.min(1.5, 1 + (combo - 2) * 0.12);
                spawnFloatingText(x, y - 24, `🔥 ${combo} COMBO!`, combo >= 3 ? '#ff4757' : '#f1c40f', comboScale);
            }
            if (idx >= 3 || combo >= 2) {
                shakeIntensity = Math.min(12, 3 + idx * 1.3 + combo);
            }
        }

        function tryGrantShakeCharge(x, y) {
            if (shakeCount < MAX_SHAKE_COUNT && Math.random() < SHAKE_DROP_CHANCE) {
                shakeCount += 1;
                updateSkillButtons();
                spawnFloatingText(x, y - 48, `🫨 흔들기 획득! (${shakeCount}/${MAX_SHAKE_COUNT})`, '#3498db', 1.15);
                playTone(523.25, 783.99, 0.14, 'sine', 0.14, 0.06);
                playTone(783.99, 1046.5, 0.18, 'triangle', 0.14, 0.14);
            }
        }

        document.getElementById('shake-btn').addEventListener('click', () => {
            if (shakeCount <= 0 || isGameOver) return;
            ensureAudio();
            shakeCount -= 1;
            shakeGraceUntil = Date.now() + 1200;
            shakeIntensity = 11;
            playSkillSound('shake');
            Composite.allBodies(world).forEach(body => {
                if (!body.isStatic) {
                    Body.setVelocity(body, {
                        x: (Math.random() - 0.5) * 8.5,
                        y: -3.2 - Math.random() * 2.2
                    });
                    Body.setAngularVelocity(body, (Math.random() - 0.5) * 0.25);
                }
            });
            spawnFloatingText(width / 2, 180, '🫨 흔들기!', '#3498db', 1.15);
            updateSkillButtons();
        });

        document.getElementById('swap-btn').addEventListener('click', () => {
            if (swapCount <= 0 || !isClickable || isGameOver) return;
            ensureAudio();
            swapCount -= 1;
            playSkillSound('swap');
            if (nextFruitIndex === currentFruitIndex) {
                nextFruitIndex = pickRandomDropFruit(currentFruitIndex);
            }
            const prev = currentFruitIndex;
            currentFruitIndex = nextFruitIndex;
            nextFruitIndex = prev;
            setNextFruit(false);
            const clawX = parseFloat(document.getElementById('claw').style.left) || (width / 2);
            spawnFloatingText(clawX, DROP_Y, '🔄 과일 교체!', '#a55eea', 1.05);
            updateSkillButtons();
        });

        // --- 🎮 마우스 및 모바일 터치 컨트롤 로직 ---

        function updateClawPosition(clientX) {
            if (isGameOver) return;
            const rect = container.getBoundingClientRect();
            if (!rect.width) return;
            let posX = ((clientX - rect.left) / rect.width) * width;
            const margin = FRUITS[currentFruitIndex].radius * 1.08;
            if (posX < margin) posX = margin;
            if (posX > width - margin) posX = width - margin;
            document.getElementById('claw').style.left = posX + 'px';
        }

        function triggerDrop() {
            if (!isClickable || isGameOver) return;
            ensureAudio();
            playDropSound();

            const clawLeftStr = document.getElementById('claw').style.left;
            const margin = FRUITS[currentFruitIndex].radius * 1.08;
            let dropX = clawLeftStr ? parseFloat(clawLeftStr) : width / 2;
            dropX = Math.min(width - margin, Math.max(margin, dropX));

            dropFruit(dropX, DROP_Y, currentFruitIndex);

            isClickable = false;
            updateSkillButtons();
            document.getElementById('next-fruit-preview').style.opacity = '0';

            setTimeout(() => {
                if (!isGameOver) {
                    setNextFruit(true);
                    isClickable = true;
                    updateSkillButtons();
                }
            }, 1000);
        }

        let lastTouchTime = 0;

        // [PC 환경] 마우스 이벤트
        container.addEventListener('mousemove', (e) => {
            if (e.target.closest('#game-over-screen')) return;
            updateClawPosition(e.clientX);
        });
        container.addEventListener('click', (e) => {
            if (e.target.closest('#game-over-screen')) return;
            if (Date.now() - lastTouchTime < 500) return;
            triggerDrop();
        });

        // [모바일 환경] 터치 이벤트
        container.addEventListener('touchstart', (e) => {
            if (isGameOver || e.target.closest('#game-over-screen')) return;
            lastTouchTime = Date.now();
            updateClawPosition(e.touches[0].clientX);
        }, { passive: true });

        container.addEventListener('touchmove', (e) => {
            if (isGameOver || e.target.closest('#game-over-screen')) return;
            e.preventDefault();
            updateClawPosition(e.touches[0].clientX);
        }, { passive: false });

        container.addEventListener('touchend', (e) => {
            if (isGameOver || e.target.closest('#game-over-screen')) return;
            lastTouchTime = Date.now();
            triggerDrop();
        });

        function createFruitBody(x, y, index, isMerged = false) {
            const config = FRUITS[index];
            const options = {
                index: index,
                restitution: 0.2,
                friction: 0.1,
                render: { visible: false }
            };
            let body;
            if (config.vertices) {
                const scaledVerts = config.vertices.map(v => ({
                    x: v.x * config.radius,
                    y: v.y * config.radius
                }));
                body = Bodies.fromVertices(x, y, [scaledVerts], options, false, 0, 10, 0);
            } else {
                body = Bodies.circle(x, y, config.radius, options);
            }
            body.droppedAt = isMerged ? 0 : Date.now();
            body.spawnScale = isMerged ? 0.35 : 1.0;
            return body;
        }

        function dropFruit(x, y, index) {
            Composite.add(world, createFruitBody(x, y, index, false));
        }

        Events.on(engine, 'collisionStart', (event) => {
            event.pairs.forEach((pair) => {
                const a = pair.bodyA.parent || pair.bodyA;
                const b = pair.bodyB.parent || pair.bodyB;
                if (a !== b && a.index !== undefined && a.index === b.index) {
                    const idx = a.index;
                    if (!Composite.allBodies(world).includes(a) || !Composite.allBodies(world).includes(b)) return;

                    const now = Date.now();
                    comboCount = (now - lastMergeTime <= 2200) ? comboCount + 1 : 1;
                    lastMergeTime = now;
                    const mult = comboCount >= 2 ? Math.min(2.5, 1 + (comboCount - 1) * 0.25) : 1;

                    if (idx === FRUITS.length - 1) {
                        const burstX = (a.position.x + b.position.x) / 2;
                        const burstY = (a.position.y + b.position.y) / 2;
                        Composite.remove(world, [a, b]);
                        const earned = Math.round(FRUITS[idx].score * 2 * mult);
                        score += earned;
                        document.getElementById('score').innerText = score;
                        spawnMergeEffects(burstX, burstY, idx, earned, comboCount);
                        playWatermelonSound();
                        tryGrantShakeCharge(burstX, burstY);
                        return;
                    }

                    const nextConfig = FRUITS[idx + 1];
                    const nextMargin = nextConfig.radius * 1.08;
                    const newX = Math.min(width - nextMargin, Math.max(nextMargin, (a.position.x + b.position.x) / 2));
                    const newY = Math.min(height - nextConfig.radius - 2, Math.max(nextConfig.radius, (a.position.y + b.position.y) / 2));
                    Composite.remove(world, [a, b]);

                    const next = createFruitBody(newX, newY, idx + 1, true);
                    Composite.add(world, next);
                    const earned = Math.round(nextConfig.score * mult);
                    score += earned;
                    document.getElementById('score').innerText = score;
                    spawnMergeEffects(newX, newY, idx + 1, earned, comboCount);
                    playMergeSound(idx + 1, comboCount);
                    tryGrantShakeCharge(newX, newY);
                }
            });
        });

        Events.on(engine, 'afterUpdate', () => {
            if (isGameOver) return;
            const now = Date.now();
            const dt = Math.min(100, Math.max(0, now - lastUpdateTick));
            lastUpdateTick = now;

            let isViolating = false;
            if (now > shakeGraceUntil) {
                for (const body of world.bodies) {
                    if (
                        !body.isStatic &&
                        body.index !== undefined &&
                        now - (body.droppedAt || 0) > 1200 &&
                        body.position.y - FRUITS[body.index].radius * 0.65 < 120 &&
                        Math.hypot(body.velocity.x, body.velocity.y) < 2.2
                    ) {
                        isViolating = true;
                        break;
                    }
                }
            }

            const bannerEl = document.getElementById('danger-banner');
            const timerEl = document.getElementById('danger-timer');
            const lineEl = document.getElementById('death-line');

            if (isViolating) {
                dangerElapsed += dt;
                bannerEl.style.display = 'block';
                timerEl.textContent = Math.max(0, (3000 - dangerElapsed) / 1000).toFixed(1);
                lineEl.classList.add('danger-active');
                if (now - lastBeepTime > 500) {
                    playDangerBeep();
                    lastBeepTime = now;
                }
                if (dangerElapsed >= 3000) {
                    bannerEl.style.display = 'none';
                    lineEl.classList.remove('danger-active');
                    triggerGameOver();
                }
            } else {
                dangerElapsed = Math.max(0, dangerElapsed - dt * 2.5);
                if (dangerElapsed === 0) {
                    bannerEl.style.display = 'none';
                    lineEl.classList.remove('danger-active');
                } else {
                    timerEl.textContent = Math.max(0, (3000 - dangerElapsed) / 1000).toFixed(1);
                }
            }
        });

        function triggerGameOver() {
            isGameOver = true;
            isClickable = false;
            document.getElementById('danger-banner').style.display = 'none';
            document.getElementById('death-line').classList.remove('danger-active');
            updateSkillButtons();
            document.getElementById('final-score').innerText = score;
            document.getElementById('game-over-screen').style.display = 'flex';
            document.getElementById('record-input-section').style.display = 'flex';
        }

        // Firebase 랭킹 등록
        const submitScoreBtn = document.getElementById('submit-score-btn');
        submitScoreBtn.addEventListener('click', async () => {
            if (submitScoreBtn.disabled) return;
            const rawName = document.getElementById('player-name').value.trim();
            const name = Array.from(rawName || "익명").slice(0, 6).join('');
            const safeScore = Number.isFinite(score) ? Math.min(1000000, Math.max(0, Math.floor(score))) : 0;
            submitScoreBtn.disabled = true;
            try {
                await db.collection("rankings").add({
                    name: name,
                    score: safeScore,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });
                alert("랭킹 등록 완료!");
                document.getElementById('record-input-section').style.display = 'none';
                fetchRankings();
            } catch (e) {
                submitScoreBtn.disabled = false;
                alert("등록 실패: " + e.message);
            }
        });

        document.getElementById('restart-btn').addEventListener('click', () => location.reload());

        // --- ★ 과일 실루엣 정렬 + 조준선 + 파티클 + 콤보 렌더링 ★ ---
        Events.on(render, 'afterRender', () => {
            const ctx = render.context;
            const shaking = shakeIntensity > 0.3;
            ctx.save();
            if (shaking) {
                ctx.translate((Math.random() - 0.5) * shakeIntensity, (Math.random() - 0.5) * shakeIntensity);
                shakeIntensity *= 0.82;
            } else {
                shakeIntensity = 0;
            }

            if (isClickable && !isGameOver) {
                const clawX = parseFloat(document.getElementById('claw').style.left) || (width / 2);
                let landingY = height;
                Composite.allBodies(world).forEach(body => {
                    if (!body.isStatic && body.index !== undefined) {
                        if (Math.abs(body.position.x - clawX) < FRUITS[body.index].radius * 0.95) {
                            landingY = Math.min(landingY, body.bounds.min.y);
                        }
                    }
                });
                const guideEndY = Math.max(DROP_Y + 20, landingY);
                ctx.save();
                ctx.beginPath();
                ctx.setLineDash([6, 6]);
                ctx.moveTo(clawX, DROP_Y + 10);
                ctx.lineTo(clawX, guideEndY);
                ctx.strokeStyle = FRUITS[currentFruitIndex].color || '#ff4757';
                ctx.lineWidth = 2;
                ctx.globalAlpha = 0.45;
                ctx.stroke();
                ctx.setLineDash([]);
                ctx.beginPath();
                ctx.arc(clawX, guideEndY, 4, 0, Math.PI * 2);
                ctx.fillStyle = FRUITS[currentFruitIndex].color || '#ff4757';
                ctx.fill();
                ctx.restore();
            }

            Composite.allBodies(world).forEach(body => {
                if (body.index !== undefined) {
                    const config = FRUITS[body.index];
                    const img = loadedImages[config.name];
                    if (img) {
                        if (body.spawnScale === undefined) body.spawnScale = 1;
                        if (body.spawnScale < 1) {
                            body.spawnScale = Math.min(1, body.spawnScale + (1 - body.spawnScale) * 0.24);
                        }
                        const s = body.spawnScale;
                        const drawWidth = config.imgWScale * config.radius * s;
                        const drawHeight = config.imgHScale * config.radius * s;
                        const drawOffsetX = config.offsetX * config.radius * s;
                        const drawOffsetY = config.offsetY * config.radius * s;

                        ctx.save();
                        ctx.translate(body.position.x, body.position.y);
                        ctx.rotate(body.angle);
                        ctx.drawImage(
                            img,
                            -drawWidth / 2 + drawOffsetX,
                            -drawHeight / 2 + drawOffsetY,
                            drawWidth,
                            drawHeight
                        );
                        ctx.restore();
                    }
                }
            });

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.16;
                p.alpha -= 0.032;
                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                    continue;
                }
                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r * p.alpha, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            for (let i = floatingTexts.length - 1; i >= 0; i--) {
                const ft = floatingTexts[i];
                ft.y += ft.vy;
                ft.alpha -= 0.022;
                if (ft.alpha <= 0) {
                    floatingTexts.splice(i, 1);
                    continue;
                }
                ctx.save();
                ctx.globalAlpha = ft.alpha;
                ctx.font = `bold ${Math.round(20 * ft.scale)}px Pretendard, sans-serif`;
                ctx.textAlign = 'center';
                ctx.lineWidth = 4;
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.92)';
                ctx.strokeText(ft.text, ft.x, ft.y);
                ctx.fillStyle = ft.color;
                ctx.fillText(ft.text, ft.x, ft.y);
                ctx.restore();
            }

            ctx.restore();
        });
    </script>
</body>
